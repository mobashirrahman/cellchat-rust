[package]
name = "cellchatrs-r-build"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "cellchatrs"
path = "../crates/cellchatrs/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
r-core = { path = "../crates/r-core" }
extendr-api = "=0.9.0"
extendr-macros = "=0.9.0"
rayon = "=1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
